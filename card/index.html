<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">

    <title>Nima Taghavi – Digital Business Card</title>
    <meta name="description" content="Digital business card of Nima Taghavi, Software Architect &amp; Full Stack Developer. Email, LinkedIn, GitHub and website – save the contact in one tap.">
    <meta name="author" content="Nima Taghavi">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0f0d1a">
    <link rel="canonical" href="https://nima-taghavi.com/card/">
    <link rel="icon" href="../favicon.ico">
    <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">

    <!-- Add to Home Screen: opens full screen like an app (manifest for Android/Chrome, meta tags for iPhone) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nima Taghavi">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Nima Taghavi" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://nima-taghavi.com/card/" />
    <meta property="og:title" content="Nima Taghavi — Software Architect &amp; Full Stack Developer" />
    <meta property="og:description" content="Digital business card of Nima Taghavi, Software Architect &amp; Full Stack Developer." />
    <meta property="og:image" content="https://nima-taghavi.com/assets/img/NimaTaghavi.jpg" />
    <meta property="og:image:width" content="240" />
    <meta property="og:image:height" content="289" />
    <meta property="og:image:alt" content="Portrait of Nima Taghavi" />
    <meta property="profile:first_name" content="Nima" />
    <meta property="profile:last_name" content="Taghavi" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nima Taghavi — Software Architect &amp; Full Stack Developer" />
    <meta name="twitter:description" content="Digital business card of Nima Taghavi, Software Architect &amp; Full Stack Developer." />
    <meta name="twitter:image" content="https://nima-taghavi.com/assets/img/NimaTaghavi.jpg" />
    <meta name="twitter:image:alt" content="Portrait of Nima Taghavi" />

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "url": "https://nima-taghavi.com/card/",
        "name": "Nima Taghavi – Digital Business Card",
        "mainEntity": { "@id": "https://nima-taghavi.com/#person", "@type": "Person", "name": "Nima Taghavi", "url": "https://nima-taghavi.com/" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Compiled from ../assets/scss/card.scss -->
    <link href="../assets/css/card.css" rel="stylesheet">
</head>

<body>

    <!-- Same markup PublicBusinessCard.razor renders, filled with this site's content. -->
    <div class="lotus-bcard" style="--lotus-bcard-primary:#6a3de8;--lotus-bcard-bg:#0f0d1a;">

        <div class="lotus-bcard__card">

            <div class="lotus-bcard__photo-wrap">
                <img src="../assets/img/NimaTaghavi.jpg" alt="Portrait of Nima Taghavi" width="180" height="180" class="lotus-bcard__photo" />
            </div>

            <h1 class="lotus-bcard__name">Nima Taghavi</h1>
            <p class="lotus-bcard__tagline">Software Architect &amp; Full Stack Developer</p>

            <div class="lotus-bcard__links">
                <a class="lotus-bcard__link" href="mailto:nima.taghavi62@gmail.com">
                    <i class="bi bi-envelope lotus-bcard__link-icon" aria-hidden="true"></i>
                    <span class="lotus-bcard__link-text">
                        <span class="lotus-bcard__link-label">Email</span>
                        <span class="lotus-bcard__link-value" dir="ltr">nima.taghavi62@gmail.com</span>
                    </span>
                </a>
                <a class="lotus-bcard__link" href="https://www.linkedin.com/in/s-nima-taghavi" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-linkedin lotus-bcard__link-icon" aria-hidden="true"></i>
                    <span class="lotus-bcard__link-text">
                        <span class="lotus-bcard__link-label">LinkedIn</span>
                        <span class="lotus-bcard__link-value" dir="ltr">s-nima-taghavi</span>
                    </span>
                </a>
                <a class="lotus-bcard__link" href="https://github.com/nimataghavi/" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-github lotus-bcard__link-icon" aria-hidden="true"></i>
                    <span class="lotus-bcard__link-text">
                        <span class="lotus-bcard__link-label">GitHub</span>
                        <span class="lotus-bcard__link-value" dir="ltr">nimataghavi</span>
                    </span>
                </a>
                <a class="lotus-bcard__link" href="https://nima-taghavi.com" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-globe lotus-bcard__link-icon" aria-hidden="true"></i>
                    <span class="lotus-bcard__link-text">
                        <span class="lotus-bcard__link-label">Website</span>
                        <span class="lotus-bcard__link-value" dir="ltr">https://nima-taghavi.com</span>
                    </span>
                </a>
            </div>

            <div class="lotus-bcard__qr">
                <div class="lotus-bcard__qr-container" id="lotus-bcard-qr"></div>
                <p class="lotus-bcard__qr-caption">Scan to visit website</p>
            </div>

            <div class="lotus-bcard__actions">
                <button class="btn btn-primary" type="button" id="lotus-bcard-save">
                    <i class="bi bi-download me-1" aria-hidden="true"></i>Save Contact
                </button>
                <button class="btn btn-outline-primary" type="button" id="lotus-bcard-share">
                    <i class="bi bi-share me-1" aria-hidden="true"></i>Share Card
                </button>
                <!-- shown only where installing is possible and the card isn't installed yet -->
                <button class="btn lotus-bcard__install" type="button" id="lotus-bcard-install" hidden>
                    <i class="bi bi-phone me-1" aria-hidden="true"></i>Add to Home Screen
                </button>
            </div>
            <p class="lotus-bcard__ios-hint" id="lotus-bcard-ios-hint" hidden>
                In Safari, tap <strong>Share</strong> <i class="bi bi-box-arrow-up" role="img" aria-label="the Share icon"></i>
                then <strong>Add to Home Screen</strong>.
            </p>

        </div>

        <div class="lotus-bcard__footer">
            <a href="https://nima-taghavi.com">https://nima-taghavi.com</a>
            <div>&copy; <span id="lotus-bcard-year"><script>document.write(new Date().getFullYear())</script></span> S. Nima Taghavi</div>
        </div>

    </div>

    <div class="lotus-bcard-toast" role="status" aria-live="polite"></div>

    <script src="../assets/js/qr-code-styling.js"></script>
    <script src="../assets/js/business-card.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            lotus.businessCard.init({
                qrContainerId: 'lotus-bcard-qr',
                cardUrl: 'https://nima-taghavi.com/card',
                primaryColor: '#6a3de8',
                qrColors: { dots: '#4b28c0', cornersSquare: '#6a3de8', cornersDot: '#9b7ef8', background: '#f7f5ff' },
                title: 'Nima Taghavi — Software Architect & Full Stack Developer',
                description: 'Software Architect & Full Stack Developer',
                vcard: {
                    fullName: 'Nima Taghavi',
                    emails: ['nima.taghavi62@gmail.com'],
                    phones: [],
                    links: ['https://www.linkedin.com/in/s-nima-taghavi', 'https://github.com/nimataghavi/', 'https://nima-taghavi.com'],
                    note: 'Software Architect & Full Stack Developer'
                }
            });
        });
    </script>
</body>

</html>
